name: tests

on:
  push:
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ['3.11', '3.12']
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - run: python -m pip install --upgrade pip
      - run: python -m pip install -e '.[dev]'
      - name: Lint
        run: ruff check src tests
      - name: Tests
        run: pytest -q
      - name: Verify no historical prediction changed
        if: github.event_name == 'pull_request'
        run: |
          # AGENTS.md rule 1: historical predictions are append-only. A pull
          # request may add prediction files, never modify or delete one.
          git fetch origin ${{ github.base_ref }} --depth=1
          CHANGED=$(git diff --name-only --diff-filter=MD \
            origin/${{ github.base_ref }}...HEAD -- predictions/ || true)
          if [ -n "$CHANGED" ]; then
            echo "Historical predictions were modified or deleted:"
            echo "$CHANGED"
            exit 1
          fi
          echo "No historical prediction was modified."
